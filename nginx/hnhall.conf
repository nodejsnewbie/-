# =============================================================================
# 华农智服 (hnhall) — 宿主机 Nginx 路由配置
# 本文件由 hnhall 仓库管理，CI 通过 deploy-nginx.sh 部署到 /etc/nginx/conf.d/40-hnhall.conf
# 域名：hnhall.linyuan.maimaioo.top → 127.0.0.1:38000（hnhall_api 容器，容器内 3000）
# =============================================================================

server {
    listen 443 ssl;
    server_name hnhall.linyuan.maimaioo.top;

    ssl_certificate     /etc/letsencrypt/live/linyuan.maimaioo.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/linyuan.maimaioo.top/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    access_log /var/log/nginx/hnhall.access.log combined;
    error_log  /var/log/nginx/hnhall.error.log warn;

    # 健康检查（SOP 必选）
    location /healthz {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    location / {
        proxy_pass http://127.0.0.1:38000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        client_max_body_size 50M;
        proxy_connect_timeout 10s;
        proxy_send_timeout   300s;
        proxy_read_timeout   300s;
        proxy_buffering off;
    }
}
